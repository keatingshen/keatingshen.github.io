<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rubik's Cube - Interactive</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #1a1a1a; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(30, 30, 30, 0.92);
            padding: 20px;
            border-radius: 12px;
            color: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            width: 320px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .timer-display {
            text-align: center;
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .timer-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .timer-value {
            font-size: 32px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            color: #6e8efb;
            text-shadow: 0 0 10px rgba(110, 142, 251, 0.5);
        }
        .timer-status {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }
        .timer-status.active {
            color: #38ef7d;
        }
        .btn-row { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 15px;
        }
        .main-btn {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            color: white;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .main-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .main-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #scrambleBtn { background: linear-gradient(135deg, #6e8efb, #a777e3); }
        #resetBtn { background: linear-gradient(135deg, #11998e, #38ef7d); }
        
        .layer-section {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 12px;
            margin-top: 5px;
        }
        .layer-section h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #aaa;
            font-weight: normal;
        }
        .layer-row {
            display: grid;
            grid-template-columns: 70px 1fr 1fr;
            gap: 8px;
            margin-bottom: 6px;
            align-items: center;
        }
        .layer-label {
            font-size: 13px;
            color: #ccc;
            font-weight: bold;
        }
        .layer-btn {
            padding: 8px 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 5px;
            background: rgba(255,255,255,0.08);
            color: white;
            transition: all 0.2s;
        }
        .layer-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }
        .layer-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .layer-btn.cw { border-left: 3px solid #6e8efb; }
        .layer-btn.ccw { border-left: 3px solid #f5af19; }
        
        #moveCount {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 13px;
            color: #888;
            display: flex;
            justify-content: space-between;
        }
        #instantReset {
            font-size: 12px;
            color: #6e8efb;
            cursor: pointer;
            text-decoration: underline;
        }
        #instantReset:hover { color: #a777e3; }
        
        .hint {
            margin: 10px 0 0 0;
            font-size: 11px;
            color: #666;
            line-height: 1.6;
        }
        .solved-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            padding: 30px 50px;
            border-radius: 15px;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            z-index: 100;
            animation: fadeInOut 3s ease-in-out;
            pointer-events: none;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="timer-display">
            <div class="timer-label">Solve Time</div>
            <div class="timer-value" id="timerValue">00:00.00</div>
            <div class="timer-status" id="timerStatus">Timer inactive</div>
        </div>
        
        <div class="btn-row">
            <button id="scrambleBtn" class="main-btn">🔀 Scramble</button>
            <button id="resetBtn" class="main-btn">✨ Solve</button>
        </div>
        
        <div class="layer-section">
            <h3>Layer Moves (90° rotation)</h3>
            <div class="layer-row">
                <span class="layer-label">Top U</span>
                <button class="layer-btn cw" data-move="U">Clockwise</button>
                <button class="layer-btn ccw" data-move="U'">Counter-CW</button>
            </div>
            <div class="layer-row">
                <span class="layer-label">Bottom D</span>
                <button class="layer-btn cw" data-move="D">Clockwise</button>
                <button class="layer-btn ccw" data-move="D'">Counter-CW</button>
            </div>
            <div class="layer-row">
                <span class="layer-label">Left L</span>
                <button class="layer-btn cw" data-move="L">Clockwise</button>
                <button class="layer-btn ccw" data-move="L'">Counter-CW</button>
            </div>
            <div class="layer-row">
                <span class="layer-label">Right R</span>
                <button class="layer-btn cw" data-move="R">Clockwise</button>
                <button class="layer-btn ccw" data-move="R'">Counter-CW</button>
            </div>
            <div class="layer-row">
                <span class="layer-label">Front F</span>
                <button class="layer-btn cw" data-move="F">Clockwise</button>
                <button class="layer-btn ccw" data-move="F'">Counter-CW</button>
            </div>
            <div class="layer-row">
                <span class="layer-label">Back B</span>
                <button class="layer-btn cw" data-move="B">Clockwise</button>
                <button class="layer-btn ccw" data-move="B'">Counter-CW</button>
            </div>
        </div>
        
        <div id="moveCount">
            <span>Moves: <strong id="stepCount">0</strong></span>
            <span id="instantReset">Instant Reset</span>
        </div>
        <p class="hint">
            💡 Click cube faces to rotate layers<br>
            🖱️ Drag empty space to rotate view, scroll to zoom<br>
            ⏱️ Timer starts after scramble, stops when solved
        </p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ============ Scene Setup ============
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(6, 6, 6);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 4;
        controls.maxDistance = 15;

        // ============ Core Variables ============
        let cubies = [];
        let isAnimating = false;
        let moveHistory = [];
        
        // Timer variables
        let timerInterval = null;
        let timerStartTime = null;
        let timerRunning = false;
        let solvedTime = null;

        const colors = {
            right: 0xff0000,   // Red +X
            left: 0xffa500,    // Orange -X
            top: 0xffffff,     // White +Y
            bottom: 0xffff00,  // Yellow -Y
            front: 0x00ff00,   // Green +Z
            back: 0x0000ff,    // Blue -Z
            inside: 0x111111   // Inside black
        };

        function createRubiksCube() {
            cubies.forEach(c => scene.remove(c));
            cubies = [];
            moveHistory = [];
            updateMoveCount();
            stopTimer();
            resetTimerDisplay();

            const geometry = new THREE.BoxGeometry(0.95, 0.95, 0.95);

            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        const materials = [
                            new THREE.MeshStandardMaterial({ color: x === 1 ? colors.right : colors.inside }),
                            new THREE.MeshStandardMaterial({ color: x === -1 ? colors.left : colors.inside }),
                            new THREE.MeshStandardMaterial({ color: y === 1 ? colors.top : colors.inside }),
                            new THREE.MeshStandardMaterial({ color: y === -1 ? colors.bottom : colors.inside }),
                            new THREE.MeshStandardMaterial({ color: z === 1 ? colors.front : colors.inside }),
                            new THREE.MeshStandardMaterial({ color: z === -1 ? colors.back : colors.inside })
                        ];
                        
                        const cubie = new THREE.Mesh(geometry, materials);
                        cubie.position.set(x, y, z);
                        scene.add(cubie);
                        cubies.push(cubie);
                    }
                }
            }
        }

        createRubiksCube();

        // ============ Raycasting ============
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (event.target.tagName === 'BUTTON' || event.target.closest('#ui')) return;
            if (isAnimating) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cubies);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                const normal = intersect.face.normal.clone().transformDirection(intersect.object.matrixWorld);
                const absNormal = new THREE.Vector3(Math.round(Math.abs(normal.x)), Math.round(Math.abs(normal.y)), Math.round(Math.abs(normal.z)));
                
                let axisIndex = absNormal.x === 1 ? 0 : (absNormal.y === 1 ? 1 : 2);
                const layerIndex = Math.round(intersect.object.position.getComponent(axisIndex));
                
                let dir = 1;
                if (axisIndex === 1) dir = intersect.point.x > 0 ? 1 : -1;
                else if (axisIndex === 0) dir = intersect.point.y > 0 ? 1 : -1;
                else if (axisIndex === 2) dir = intersect.point.x > 0 ? -1 : 1;
                
                executeMove({ axisIndex, layerIndex, dir }, 250, null, true);
                checkSolved();
            }
        });

        // ============ Core Rotation ============
        function executeMove(params, duration, callback, addToHistory = true) {
            if (isAnimating) return;
            isAnimating = true;

            const { axisIndex, layerIndex, dir } = params;
            
            if (addToHistory) {
                moveHistory.push({ ...params });
                updateMoveCount();
            }
            
            const layerCubies = [];
            cubies.forEach(c => {
                const val = Math.round(c.position.getComponent(axisIndex));
                if (val === layerIndex) layerCubies.push(c);
            });

            const pivot = new THREE.Object3D();
            scene.add(pivot);
            layerCubies.forEach(c => pivot.attach(c));

            const angle = (Math.PI / 2) * dir;
            let startTime = null;

            function animate(time) {
                if (!startTime) startTime = time;
                const progress = Math.min((time - startTime) / duration, 1);
                
                const ease = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;
                const currentAngle = angle * ease;

                if (axisIndex === 0) pivot.rotation.x = currentAngle;
                if (axisIndex === 1) pivot.rotation.y = currentAngle;
                if (axisIndex === 2) pivot.rotation.z = currentAngle;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    if (axisIndex === 0) pivot.rotation.x = angle;
                    if (axisIndex === 1) pivot.rotation.y = angle;
                    if (axisIndex === 2) pivot.rotation.z = angle;

                    layerCubies.forEach(c => {
                        scene.attach(c);
                        c.position.x = Math.round(c.position.x);
                        c.position.y = Math.round(c.position.y);
                        c.position.z = Math.round(c.position.z);
                        
                        c.rotation.x = Math.round(c.rotation.x / (Math.PI / 2)) * (Math.PI / 2);
                        c.rotation.y = Math.round(c.rotation.y / (Math.PI / 2)) * (Math.PI / 2);
                        c.rotation.z = Math.round(c.rotation.z / (Math.PI / 2)) * (Math.PI / 2);
                    });

                    scene.remove(pivot);
                    isAnimating = false;
                    if (callback) callback();
                }
            }
            requestAnimationFrame(animate);
        }

        function updateMoveCount() {
            document.getElementById('stepCount').textContent = moveHistory.length;
        }

        function setUIEnabled(enabled) {
            document.querySelectorAll('.layer-btn, .main-btn').forEach(btn => {
                if (enabled) {
                    btn.removeAttribute('disabled');
                } else {
                    btn.setAttribute('disabled', 'disabled');
                }
            });
        }

        // ============ Move Definitions ============
        const moveDefinitions = {
            'U':  { axisIndex: 1, layerIndex:  1, dir: -1 },
            "U'": { axisIndex: 1, layerIndex:  1, dir:  1 },
            'D':  { axisIndex: 1, layerIndex: -1, dir:  1 },
            "D'": { axisIndex: 1, layerIndex: -1, dir: -1 },
            'L':  { axisIndex: 0, layerIndex: -1, dir:  1 },
            "L'": { axisIndex: 0, layerIndex: -1, dir: -1 },
            'R':  { axisIndex: 0, layerIndex:  1, dir: -1 },
            "R'": { axisIndex: 0, layerIndex:  1, dir:  1 },
            'F':  { axisIndex: 2, layerIndex:  1, dir: -1 },
            "F'": { axisIndex: 2, layerIndex:  1, dir:  1 },
            'B':  { axisIndex: 2, layerIndex: -1, dir:  1 },
            "B'": { axisIndex: 2, layerIndex: -1, dir: -1 },
        };

        function doNamedMove(name) {
            if (isAnimating) return;
            if (!moveDefinitions[name]) return;
            executeMove({ ...moveDefinitions[name] }, 250, () => {
                checkSolved();
            }, true);
        }

        // ============ Scramble ============
        function scramble() {
            if (isAnimating) return;
            
            const scrambleBtn = document.getElementById('scrambleBtn');
            scrambleBtn.textContent = '🔀 Scrambling...';
            setUIEnabled(false);
            stopTimer();
            resetTimerDisplay();
            
            let moves = 0;
            const maxMoves = 25;

            function doMove() {
                if (moves >= maxMoves) {
                    scrambleBtn.textContent = '🔀 Scramble';
                    setUIEnabled(true);
                    startTimer();
                    return;
                }

                const params = {
                    axisIndex: Math.floor(Math.random() * 3),
                    layerIndex: Math.floor(Math.random() * 3) - 1,
                    dir: Math.random() > 0.5 ? 1 : -1
                };

                executeMove(params, 80, () => {
                    moves++;
                    doMove();
                }, true);
            }
            doMove();
        }

        // ============ Animated Solve ============
        function resetAnimated() {
            if (isAnimating) return;
            
            const resetBtn = document.getElementById('resetBtn');
            
            if (moveHistory.length === 0) {
                createRubiksCube();
                return;
            }
            
            const reverseMoves = [...moveHistory].reverse();
            moveHistory = [];
            updateMoveCount();
            
            resetBtn.textContent = '⏳ Solving...';
            setUIEnabled(false);
            
            let i = 0;
            function playReverse() {
                if (i >= reverseMoves.length) {
                    resetBtn.textContent = '✨ Solve';
                    setUIEnabled(true);
                    stopTimer();
                    cubies.forEach(c => {
                        c.position.x = Math.round(c.position.x);
                        c.position.y = Math.round(c.position.y);
                        c.position.z = Math.round(c.position.z);
                        c.rotation.x = Math.round(c.rotation.x / (Math.PI / 2)) * (Math.PI / 2);
                        c.rotation.y = Math.round(c.rotation.y / (Math.PI / 2)) * (Math.PI / 2);
                        c.rotation.z = Math.round(c.rotation.z / (Math.PI / 2)) * (Math.PI / 2);
                    });
                    return;
                }
                const move = reverseMoves[i];
                const inverseMove = { axisIndex: move.axisIndex, layerIndex: move.layerIndex, dir: -move.dir };
                
                executeMove(inverseMove, 80, () => {
                    i++;
                    playReverse();
                }, false);
            }
            playReverse();
        }

        function instantReset() {
            if (isAnimating) return;
            createRubiksCube();
        }

        // ============ Timer Functions ============
        function startTimer() {
            if (timerRunning) return;
            timerRunning = true;
            timerStartTime = Date.now();
            document.getElementById('timerStatus').textContent = 'Timer running...';
            document.getElementById('timerStatus').className = 'timer-status active';
            
            timerInterval = setInterval(() => {
                const elapsed = Date.now() - timerStartTime;
                updateTimerDisplay(elapsed);
            }, 10);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            timerRunning = false;
            document.getElementById('timerStatus').className = 'timer-status';
        }

        function resetTimerDisplay() {
            document.getElementById('timerValue').textContent = '00:00.00';
            document.getElementById('timerStatus').textContent = 'Timer inactive';
            document.getElementById('timerStatus').className = 'timer-status';
            solvedTime = null;
        }

        function updateTimerDisplay(elapsed) {
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            const milliseconds = Math.floor((elapsed % 1000) / 10);
            
            const display = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(milliseconds).padStart(2, '0')}`;
            document.getElementById('timerValue').textContent = display;
        }

        // ============ Solved Detection ============
        function checkSolved() {
            if (!timerRunning) return;
            
            const faces = {
                right: { axisIndex: 0, layerIndex: 1, color: null },
                left: { axisIndex: 0, layerIndex: -1, color: null },
                top: { axisIndex: 1, layerIndex: 1, color: null },
                bottom: { axisIndex: 1, layerIndex: -1, color: null },
                front: { axisIndex: 2, layerIndex: 1, color: null },
                back: { axisIndex: 2, layerIndex: -1, color: null }
            };

            for (const [faceName, face] of Object.entries(faces)) {
                const faceCubies = cubies.filter(c => 
                    Math.round(c.position.getComponent(face.axisIndex)) === face.layerIndex
                );

                const faceColors = new Set();
                faceCubies.forEach(cubie => {
                    const material = cubie.material[face.axisIndex === 0 ? (face.layerIndex === 1 ? 0 : 1) : 
                                                   face.axisIndex === 1 ? (face.layerIndex === 1 ? 2 : 3) : 
                                                   (face.layerIndex === 1 ? 4 : 5)];
                    faceColors.add(material.color.getHex());
                });

                if (faceColors.size > 1) return;
            }

            // Puzzle is solved!
            const elapsed = Date.now() - timerStartTime;
            solvedTime = elapsed;
            stopTimer();
            document.getElementById('timerStatus').textContent = `Solved! Time: ${formatTime(elapsed)}`;
            document.getElementById('timerStatus').className = 'timer-status';
            
            // Show celebration message
            showSolvedMessage(elapsed);
        }

        function formatTime(elapsed) {
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            const milliseconds = Math.floor((elapsed % 1000) / 10);
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(milliseconds).padStart(2, '0')}`;
        }

        function showSolvedMessage(elapsed) {
            const message = document.createElement('div');
            message.className = 'solved-message';
            message.textContent = `🎉 Solved! ${formatTime(elapsed)}`;
            document.body.appendChild(message);
            
            setTimeout(() => {
                message.remove();
            }, 3000);
        }

        // ============ Event Bindings ============
        document.querySelectorAll('.layer-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                doNamedMove(btn.dataset.move);
            });
        });

        document.getElementById('scrambleBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            scramble();
        });
        
        document.getElementById('resetBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            resetAnimated();
        });

        document.getElementById('instantReset').addEventListener('click', (e) => {
            e.stopPropagation();
            instantReset();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============ Render Loop ============
        function render() {
            requestAnimationFrame(render);
            controls.update();
            renderer.render(scene, camera);
        }
        render();

    </script>
</body>
</html>
